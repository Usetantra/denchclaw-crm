# ─── DenchClaw CRM — claw.usetantra.com ──────────────────────────────────────
# Install as /etc/nginx/sites-available/claw.usetantra.com, symlink into
# sites-enabled, then:  nginx -t && systemctl reload nginx
#
# READ THE EXISTING CONFIG ON THE BOX FIRST. This is written against the layout
# recorded in the repo (app on 127.0.0.1:3100, dashboard at /crm/); if the live
# file differs, reconcile rather than overwrite.
#
# This is a NEW, SEPARATE server block. Do not edit the staging.usetantra.com
# vhost to make this work — the CRM stays reachable there during the changeover
# so there is an instant rollback, and staging is retired deliberately later.
#
# Get the certificate WITHOUT letting certbot rewrite anything:
#
#     sudo certbot certonly --webroot -w /var/www/html -d claw.usetantra.com
#
# `certbot --nginx` edits server blocks it judges relevant and can add a global
# HTTPS redirect. On a box already serving a live staging vhost, `certonly` is
# the difference between "adds a certificate" and "rewrites someone else's site".
#
# ── TWO STAGES ───────────────────────────────────────────────────────────────
# STAGE 1 (now): mirror what staging does today — Basic auth in front, internal
#   key injected server-side. Nothing about the current security posture changes;
#   the host simply gains a second name.
# STAGE 2 (Phase 4 of docs/GOING_LIVE.md): Clerk is provisioned, Basic auth comes
#   out, and the two BLANKING lines below get uncommented.
#
# Shipping stage 2 first would give you a hostname resolving to a dashboard
# nobody can sign in to, because Clerk is not set up yet.
#
# ── THE ONE THING TO GET RIGHT ───────────────────────────────────────────────
# nginx forwards client request headers to the upstream BY DEFAULT. So it is not
# enough to delete the old `proxy_set_header X-Internal-Key <key>;` line — with
# it merely absent, a browser could send its OWN X-Internal-Key and be
# authenticated as a machine, bypassing Clerk completely. Both headers must be
# actively BLANKED. An empty header arrives as '' in Express, which
# requireAuthAsync treats as absent.
#
# This is the single highest-severity line in the whole deployment.

server {
    listen 80;
    listen [::]:80;
    server_name claw.usetantra.com;
    # certbot rewrites this block; keep the ACME path reachable.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name claw.usetantra.com;

    ssl_certificate     /etc/letsencrypt/live/claw.usetantra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/claw.usetantra.com/privkey.pem;

    # The app's global body limit is 2mb (express.json). Setting nginx slightly
    # higher means an oversize request gets Express's JSON 413 (which names the
    # limit) rather than nginx's HTML one.
    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Dashboard ────────────────────────────────────────────────────────────
    # STAGE 1: Basic auth, reusing the SAME htpasswd file the staging vhost
    # already uses — one credential to rotate, not two. Find it with:
    #     grep -r auth_basic_user_file /etc/nginx/sites-available/
    # STAGE 2: delete these two lines. Clerk becomes the gate, and leaving Basic
    # auth on top just means signing in twice.
    location = /crm { return 301 /crm/; }
    location /crm/ {
        auth_basic "DenchClaw CRM";
        auth_basic_user_file /etc/nginx/.htpasswd;   # auto-detected by bin/deploy-claw.sh
        alias /home/yogi/denchclaw-crm/web/;
        index index.html;
        try_files $uri $uri/ /crm/index.html;

        # Internal architecture documentation — not something to serve publicly.
        location = /crm/denchclaw-crm-workflow.html { return 404; }
    }
    location = / { return 302 /crm/; }

    # ── Browser → API. Clerk-authenticated. ──────────────────────────────────
    location /crm/api/ {
        proxy_pass http://127.0.0.1:3100/api/crm/;

        auth_basic "DenchClaw CRM";                  # STAGE 2: delete
        auth_basic_user_file /etc/nginx/.htpasswd;   # STAGE 2: delete

        # ── STAGE 1: inject, exactly as the staging vhost does today ─────────
        # Replace with the real key from /home/yogi/denchclaw-crm/.env.
        # STAGE 2: delete both lines and uncomment the two BLANKING lines below.
        proxy_set_header X-Internal-Key "REPLACE_WITH_INTERNAL_API_KEY";
        proxy_set_header X-Company-Id   "tantra";

        # ── STAGE 2 (Phase 4 of docs/GOING_LIVE.md) ──────────────────────────
        # ★ THE BYPASS GUARD ★ — blank, do not merely omit. See the header note.
        # nginx forwards client headers by default, so deleting the injection
        # lines above is NOT enough: a browser could then send its own
        # X-Internal-Key and skip Clerk entirely.
        # proxy_set_header X-Internal-Key "";
        # proxy_set_header X-Company-Id   "";

        # The Clerk bearer token. Harmless in stage 1 (the app ignores it when
        # Clerk is unconfigured), required in stage 2.
        proxy_set_header Authorization $http_authorization;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /contacts/export streams keyset batches and can run for minutes on a
        # large tenant. Buffering would hand the client a truncated file with a
        # 200 status when the upstream dies mid-stream.
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── Provider webhooks — MUST NOT be touched ──────────────────────────────
    # These carry no internal key by design; each is secret- or token-checked
    # inside the app (x-webhook-secret, x-marketing-secret, or a URL token).
    # They are also how Twilio/Resend/Tantra reach us, so a sign-in gate here
    # would break inbound silently.
    location /webhooks/ {
        proxy_pass http://127.0.0.1:3100/webhooks/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Twilio signs the FULL public URL, so scheme and Host must survive or
        # signature validation fails.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Short public prefix for invite links (/m/i/<token>). Deliberately not
    # under /api/, so "everything under /api needs auth" stays true. Ends in a
    # 302 to the destination — do not let proxy_redirect rewrite it.
    location /m/ {
        proxy_pass http://127.0.0.1:3100/m/;
        proxy_redirect off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unauthenticated liveness probe.
    location = /health {
        proxy_pass http://127.0.0.1:3100/health;
        access_log off;
    }
}

# ── If the automation engines reach the API through nginx ────────────────────
# Check FIRST — `grep -rn 'crm/api' ` across the engines repo, and look for
# non-browser user agents on /crm/api in the access log. If any machine caller
# traverses /crm/api/, the blanks above kill it instantly, and the 401s appear
# only in ITS log, not the CRM's. In that case add the block below, repoint the
# engines at it, and only then flip /crm/api/.
#
# location /crm/machine-api/ {
#     proxy_pass http://127.0.0.1:3100/api/crm/;
#     proxy_set_header X-Internal-Key $http_x_internal_key;
#     proxy_set_header X-Company-Id   $http_x_company_id;
#     proxy_set_header Host            $host;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# }
