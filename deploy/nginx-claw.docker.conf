# ─── DenchClaw CRM — claw.usetantra.com (Docker / Compose, STAGE 2 / Clerk) ──
# This is the containerised twin of deploy/nginx-claw.usetantra.com.conf.
# Differences from the bare-metal file, and ONLY these:
#   - upstream is the compose service `app:3100`, not 127.0.0.1:3100
#   - the dashboard is served from the mounted ./web at /usr/share/nginx/web
#   - the ACME webroot is the shared `certbot-www` volume at /var/www/certbot
#   - it is written in STAGE 2 (Clerk) from the start: NO Basic auth, and the
#     internal-key headers are actively BLANKED (see the guard note below).
#
# ── THE SINGLE HIGHEST-SEVERITY THING IN THIS FILE ───────────────────────────
# nginx forwards client request headers to the upstream BY DEFAULT. So it is not
# enough to simply not set X-Internal-Key — a browser could send its OWN
# X-Internal-Key and be authenticated as a MACHINE, bypassing Clerk entirely.
# The header must be actively BLANKED. An empty header arrives as '' in Express,
# which requireAuthAsync treats as absent. Same for X-Company-Id.

upstream denchclaw_app {
    server app:3100;
}

server {
    listen 80;
    listen [::]:80;
    server_name claw.usetantra.com;

    # certbot HTTP-01 challenge — must stay reachable on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name claw.usetantra.com;

    ssl_certificate     /etc/letsencrypt/live/claw.usetantra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/claw.usetantra.com/privkey.pem;

    # The app's global body limit is 2mb (express.json). Setting nginx slightly
    # higher means an oversize request gets Express's JSON 413 (which names the
    # limit) rather than nginx's terse HTML one.
    client_max_body_size 4m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Dashboard (static, served straight from the mounted ./web) ───────────
    # Clerk is the gate now, so there is NO Basic auth here.
    location = /crm { return 301 /crm/; }
    location /crm/ {
        alias /usr/share/nginx/web/;
        index index.html;
        try_files $uri $uri/ /crm/index.html;

        # Internal architecture documentation — not something to serve publicly.
        location = /crm/denchclaw-crm-workflow.html { return 404; }
    }
    location = / { return 302 /crm/; }

    # ── Browser → API. Clerk-authenticated. ──────────────────────────────────
    location /crm/api/ {
        proxy_pass http://denchclaw_app/api/crm/;

        # ★ THE BYPASS GUARD ★ — blank, do not merely omit. See the header note.
        proxy_set_header X-Internal-Key "";
        proxy_set_header X-Company-Id   "";

        # The Clerk bearer token the browser sends.
        proxy_set_header Authorization $http_authorization;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /contacts/export streams keyset batches and can run for minutes on a
        # large tenant. Buffering would hand the client a truncated file with a
        # 200 status when the upstream dies mid-stream.
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── Provider webhooks — carry no internal key by design ──────────────────
    # Each is secret- or token-checked inside the app (x-webhook-secret,
    # x-marketing-secret, or a URL token). Twilio signs the FULL public URL, so
    # scheme and Host must survive intact or signature validation fails.
    location /webhooks/ {
        proxy_pass http://denchclaw_app/webhooks/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Short public prefix for invite / tracked links (/m/i/<token>). Ends in a
    # 302 to the destination — do not let proxy_redirect rewrite it.
    location /m/ {
        proxy_pass http://denchclaw_app/m/;
        proxy_redirect off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unauthenticated liveness probe.
    location = /health {
        proxy_pass http://denchclaw_app/health;
        access_log off;
    }
}
